services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cs2squad-api
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    expose:
      - "5000"
    volumes:
      - ./rds-ca-bundle.pem:/app/rds-ca-bundle.pem:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    container_name: cs2squad-caddy
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
